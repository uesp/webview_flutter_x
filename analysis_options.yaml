include: package:flutter_lints/flutter.yaml

# Pigeon-generated ProxyApi codecs can be unused; known upstream issue:
# https://github.com/flutter/flutter/issues/183945
analyzer:
  exclude:
    - '**/*.g.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Upstream Flutter TODO notes; not actionable in this fork.
    todo: ignore

linter:
  rules:
    constant_identifier_names: false
