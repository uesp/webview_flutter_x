name: webview_flutter_x
description: An extension of webview_flutter to load local HTML,CSS and Javascript from Assets or Strings and much more.

version: 0.4.20
publish_to: none

homepage: https://github.com/uesp/webview_flutter_x

environment:
  sdk: ">=3.2.3 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  mime: ^2.0.0
  # Bundled forks (path) — replaces hosted webview_flutter + platform impls.
  webview_flutter:
    path: webview_flutter
  webview_flutter_wkwebview:
    path: wkwebview_flutter
  webview_flutter_android:
    path: webview_flutter_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# When this package is the pub root (IDE / example), force path forks over
# any residual hosted constraints. Ignored when consumed by the app.
dependency_overrides:
  webview_flutter:
    path: webview_flutter
  webview_flutter_wkwebview:
    path: wkwebview_flutter
  webview_flutter_android:
    path: webview_flutter_android
